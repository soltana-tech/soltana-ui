name: Update Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: false

concurrency:
  group: update-snapshots-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Build
        run: pnpm run build

      - name: Update snapshots
        run: pnpm run test:e2e:update

      - name: Commit updated snapshots
        run: |
          shopt -s globstar nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/**/*-snapshots/
          git diff --cached --quiet && echo "No snapshot changes" && exit 0
          git commit -m "Update Playwright snapshot baselines"
          gh auth setup-git
          git push origin HEAD:${{ github.event.inputs.branch || github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
