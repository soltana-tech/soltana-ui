name: Accessibility Matrix

on:
  push:
    branches: [main]
    paths:
      - 'packages/soltana-ui/src/styles/**'
      - 'tests/a11y-matrix/**'
      - 'tests/fixtures/render.ts'
      - 'tests/fixtures/combinations.ts'
      - 'tests/fixtures/assets.ts'
  pull_request:
    branches: [main]
    paths:
      - 'packages/soltana-ui/src/styles/**'
      - 'tests/a11y-matrix/**'
      - 'tests/fixtures/render.ts'
      - 'tests/fixtures/combinations.ts'
      - 'tests/fixtures/assets.ts'
  workflow_dispatch:

concurrency:
  group: a11y-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  a11y-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Run accessibility matrix
        run: pnpm run test:a11y-matrix

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-matrix-results
          path: a11y-matrix-results/
          retention-days: 90
