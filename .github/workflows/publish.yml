name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.2

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Publish to npm (trusted publishing via OIDC)
        run: |
          publish_dir="$RUNNER_TEMP/soltana-packages"
          mkdir -p "$publish_dir"

          for package_dir in packages/tokens packages/soltana-ui packages/mermaid packages/react; do
            archive=$(pnpm --dir "$package_dir" pack --pack-destination "$publish_dir" | tail -n 1)
            package_name=$(tar -xOf "$archive" package/package.json | jq -r .name)
            package_version=$(tar -xOf "$archive" package/package.json | jq -r .version)

            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published; skipping"
            else
              npm publish "$archive" --access public --provenance
            fi
          done
